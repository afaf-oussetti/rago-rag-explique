  - { id: s01e02, titre: "Le principe du RAG : récupérer, augmenter, générer" }
  - { id: s01e03, titre: "Le chunking : découper les documents en fiches" }
  - { id: s01e04, titre: "Les embeddings : transformer les mots en coordonnées" }
  - { id: s01e05, titre: "La recherche vectorielle et la similarité cosinus" }
  - { id: s01e06, titre: "Les bases vectorielles : FAISS, Chroma, pgvector" }
  - { id: s01e07, titre: "Le prompt augmenté et la fenêtre de contexte" }
  - { id: s02e01, titre: "La recherche hybride : mots-clés et sens" }
  - { id: s02e02, titre: "Le reranking : trier les résultats" }
  - { id: s02e03, titre: "La réécriture de requête et HyDE" }
  - { id: s02e04, titre: "Les métadonnées : filtrer les fiches" }
  - { id: s02e05, titre: "Évaluer un RAG : fidélité et pertinence" }

