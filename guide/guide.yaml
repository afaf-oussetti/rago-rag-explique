# Pages fixes du guide PDF « Le RAG expliqué par Rago ».
# Les chapitres sont dans guide/chapitres/ : un fichier par épisode publié.
# Générer le PDF : python -m rago guide

titre: "Le RAG expliqué par Rago"
sous_titre: "Le guide qui grandit à chaque épisode"
auteur: "Afaf.IA"
licence: >-
  Ce guide est publié sous licence CC BY-NC 4.0 : tu peux le partager librement en citant
  Afaf.IA, mais pas le vendre.

bienvenue:
  - >-
    Salut ! Moi, c'est Rago. Je suis un **LLM**, un « grand modèle de langage », comme ceux qui
    font tourner ChatGPT, Claude ou Gemini.
  - >-
    J'ai un gros défaut : quand je ne sais pas, j'invente. Dans la série, j'apprends pas à pas à
    chercher dans des documents avant de répondre. Cette technique a un nom : le **RAG**.
  - >-
    Ce guide accompagne les vidéos. Chaque chapitre reprend un épisode, avec plus de détails, des
    illustrations, un résumé et un petit exercice. Il s'enrichit à chaque nouvel épisode : garde-le
    et reviens chercher la nouvelle version !

comment_lire:
  - "Un chapitre = un épisode = une seule notion."
  - "Aucune connaissance en programmation n'est nécessaire."
  - "Les mots en gras sont expliqués dans le glossaire, à la fin du guide."

rag_une_page:
  intro: >-
    **RAG** veut dire *Retrieval-Augmented Generation*, en français « génération augmentée par la
    récupération ». Derrière ce nom compliqué se cache une idée simple : avant de répondre, on va
    chercher les bonnes informations.
  etapes:
    - nom: "Récupérer"
      anglais: "Retrieval"
      texte: "On cherche, dans une collection de documents, les passages qui parlent de la question."
    - nom: "Augmenter"
      anglais: "Augmented"
      texte: "On ajoute ces passages à la question, pour que le modèle les ait sous les yeux."
    - nom: "Générer"
      anglais: "Generation"
      texte: "Le modèle rédige sa réponse en s'appuyant sur ces passages, et peut citer ses sources."
  conclusion: >-
    Résultat : moins d'inventions, des réponses à jour, et des sources qu'on peut vérifier. Chaque
    chapitre de ce guide détaille une pièce de cette mécanique.

programme:
