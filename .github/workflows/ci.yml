name: CI

on:
  push:
  pull_request:

jobs:
  lint-et-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le projet et les outils de développement
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest
