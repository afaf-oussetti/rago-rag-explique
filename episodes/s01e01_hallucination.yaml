# S01E01 · Rago invente des réponses : l'hallucination des LLM
#
# Chaque réplique contient :
#   section    : hook, probleme, solution, recap ou teaser
#   texte      : ce que Rago dit (la voix et les sous-titres en sont tirés)
#   expression : neutre, content, fier, gene, perdu, pensif ou excite
#   mot_cle    : (facultatif) mot(s) surligné(s) en orange dans les sous-titres
#   pause_apres: (facultatif) silence ajouté après la réplique, en secondes
#   animation  : (facultatif) ce qui se passe à l'écran, pour s'y retrouver
#                (l'animation elle-même est codée dans src/rago/scenes/s01e01.py)

id: s01e01
saison: 1
episode: 1
titre: "L'hallucination"
notion: "L'hallucination des LLM"

repliques:
  - section: hook
    texte: "La tour Eiffel ? Construite en 1972… par des pingouins !"
    expression: fier
    mot_cle: "1972"
    animation: "Une tour Eiffel apparaît, des pingouins arrivent à ses pieds."

  - section: probleme
    texte: "Euh… en vrai, c'est 1889. Et je n'avais aucune source !"
    expression: gene
    mot_cle: "1889"
    animation: "Les pingouins disparaissent, 1972 est barré en rose, 1889 s'affiche en vert."
    pause_apres: 1.0

  - section: probleme
    texte: "Je suis un LLM. J'ai lu des milliards de textes, et je devine le mot le plus probable."
    expression: pensif
    mot_cle: "probable"
    animation: "« La tour Eiffel est… » et trois mots candidats avec leur probabilité."

  - section: probleme
    texte: "C'est comme l'autocomplétion de ton téléphone… mais en beaucoup plus fort."
    expression: neutre
    mot_cle: "autocomplétion"
    animation: "Un téléphone propose trois mots au-dessus du clavier."

  - section: probleme
    texte: "Le problème ? Quand je ne sais pas, je ne dis pas « je ne sais pas ». J'invente une réponse qui sonne juste."
    expression: perdu
    mot_cle: "J'invente"
    animation: "Des mots roses volent et s'assemblent en une phrase fausse."
    pause_apres: 0.8

  - section: solution
    texte: "Ça s'appelle une hallucination. Comme un élève qui récite, très sûr de lui, une leçon qu'il n'a jamais lue."
    expression: pensif
    mot_cle: "hallucination"
    animation: "Le mot « hallucination » en grand, puis un livre fermé."
    pause_apres: 1.0

  - section: solution
    texte: "Et le pire : je le dis avec le même aplomb que quand j'ai raison."
    expression: gene
    mot_cle: "même aplomb"
    animation: "Deux bulles identiques, 1889 et 1972 : impossible de voir laquelle est fausse."
    pause_apres: 0.8

  - section: solution
    texte: "La solution ? Me donner les bons documents avant de répondre."
    expression: content
    mot_cle: "documents"
    animation: "Trois documents verts glissent vers Rago."

  - section: solution
    texte: "Je cherche d'abord dans les documents, puis je réponds avec mes sources. Ça s'appelle le RAG."
    expression: content
    mot_cle: "RAG"
    animation: "Documents → Rago → réponse avec source, puis les lettres R-A-G s'allument."
    pause_apres: 1.2

  - section: recap
    texte: "À retenir : un LLM sans sources, c'est un élève qui répond sans ouvrir le livre."
    expression: content
    mot_cle: "sans sources"
    animation: "Carte « À retenir » avec la phrase-récap."
    pause_apres: 1.0

  - section: teaser
    texte: "Prochain épisode : on m'offre une bibliothèque !"
    expression: excite
    mot_cle: "bibliothèque"
    animation: "Une bibliothèque remplie de livres apparaît."

  - section: teaser
    texte: "Abonne-toi pour suivre mon histoire, et commente RAG pour recevoir le PDF !"
    expression: excite
    mot_cle: "commente RAG"
    animation: "Boutons « Abonne-toi » et « Commente RAG »."
